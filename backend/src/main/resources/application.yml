spring:
  application:
    name: relay-backend
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
    driver-class-name: org.postgresql.Driver
  data:
    redis:
      url: ${REDIS_URL}
  mvc:
    async:
      request-timeout: 10m

server:
  port: ${PORT:8080}

app:
  cors:
    allowed-origins:
      - http://localhost:5173
      - https://relay-aga.pages.dev
  ai:
    api-base: ${AI_API_BASE:https://api.openai.com/v1}
  security:
    jwt-secret: ${JWT_SECRET:change-me-in-env}
  mail:
    host: ${QQ_SMTP_HOST:smtp.qq.com}
    port: ${QQ_SMTP_PORT:465}
    username: ${QQ_SMTP_USERNAME:2997657261@qq.com}
    password: ${QQ_SMTP_PASSWORD:mlajppzvoexhdddf}
    from: ${QQ_SMTP_FROM:2997657261@qq.com}
  verification:
    code-ttl-minutes: ${VERIFICATION_CODE_TTL_MINUTES:10}
  rate-limit:
    enabled: ${RATE_LIMIT_ENABLED:true}
    window-seconds: ${RATE_LIMIT_WINDOW_SECONDS:60}
    max-requests: ${RATE_LIMIT_MAX_REQUESTS:60}
  novel-storage:
    github:
      repository: ${GITHUB_NOVEL_REPOSITORY:weicengxing/relay-novel-storage}
      branch: ${GITHUB_NOVEL_BRANCH:main}
      base-path: ${GITHUB_NOVEL_BASE_PATH:novels}
      token: ${GITHUB_NOVEL_TOKEN:}
  chat-history:
    enabled: ${CHAT_HISTORY_ENABLED:true}
    max-file-bytes: ${CHAT_HISTORY_MAX_FILE_BYTES:5242880}
    github:
      repository: ${GITHUB_CHAT_HISTORY_REPOSITORY:}
      branch: ${GITHUB_CHAT_HISTORY_BRANCH:main}
      base-path: ${GITHUB_CHAT_HISTORY_BASE_PATH:chat-history}
      token: ${GITHUB_CHAT_HISTORY_TOKEN:}
